<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Todo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <h1>Todo App</h1>

    <form id="todoForm" class="row">
      <label class="sr-only" for="todoInput">Add todo</label>
      <input id="todoInput" type="text" placeholder="Type a task..." autocomplete="off" />
      <button class="btn-add" type="submit">Add</button>
    </form>

    <ul id="todoList"></ul>

    <div id="emptyState" class="empty" style="display:none;">No todos yet. Add one above!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
